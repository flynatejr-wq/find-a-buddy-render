databases:
  - name: find-a-buddy-db
    plan: free
    databaseName: find_a_buddy
    user: find_a_buddy_user

services:
  - type: web
    name: find-a-buddy
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: find-a-buddy-db
          property: connectionString
