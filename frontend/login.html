<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — Find a Buddy</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  :root {
    --navy-900: #0a3a8c;
    --navy-800: #0d47ab;
    --orange-600: #e8620c;
    --orange-500: #ff7a1a;
    --paper-0: #faf7f0;
    --paper-50: #f2ede1;
    --ink-900: #171310;
    --ink-600: #4a463f;
    --line: #ddd4bf;
    --card: #ffffff;
    --r-sm: 8px;
    --r-lg: 16px;
    --danger: #c23b3b;
    --danger-bg: #fbe6e6;
    --success: #2f8f5b;
    --success-bg: #e3f3ea;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper-50);
    color: var(--ink-900);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: 'Bebas Neue', 'IBM Plex Sans', sans-serif; letter-spacing: 0.02em; }

  .public-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.6rem; border-bottom: 1px solid var(--line);
  }
  .public-nav .wordmark { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--navy-900); letter-spacing: 0.03em; text-decoration: none; }
  .public-nav .wordmark span { color: var(--orange-500); }
  .public-nav a { font-size: 0.88rem; font-weight: 600; color: var(--ink-600); text-decoration: none; }

  .auth-wrap {
    min-height: calc(100vh - 65px);
    display: flex; align-items: center; justify-content: center;
    padding: 2.5rem 1.5rem;
  }
  .auth-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 2.2rem 2rem; width: 100%; max-width: 380px;
    box-shadow: 0 8px 24px -12px rgba(8,22,39,0.18);
  }
  .auth-card .kicker { font-size: 0.8rem; font-weight: 600; color: var(--orange-600); margin-bottom: 0.3rem; }
  .auth-card h1.display { font-size: 2rem; margin: 0 0 0.4rem; }
  .auth-card p.sub { color: var(--ink-600); font-size: 0.9rem; margin: 0 0 1.6rem; }

  .field { margin-bottom: 1.1rem; }
  .field label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--ink-600); margin-bottom: 0.35rem; }
  .field input {
    width: 100%; padding: 0.7rem 0.8rem; border: 1px solid var(--line); border-radius: var(--r-sm);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 0.94rem; background: var(--paper-0); color: var(--ink-900);
  }
  .field input:focus { outline: none; border-color: var(--orange-500); }

  .btn {
    width: 100%; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.92rem; font-weight: 600;
    padding: 0.75rem; border: none; border-radius: var(--r-sm); cursor: pointer;
    background: var(--orange-500); color: white; margin-top: 0.4rem;
  }
  .btn:disabled { opacity: 0.6; cursor: default; }

  .form-error {
    background: var(--danger-bg); color: var(--danger); font-size: 0.85rem;
    padding: 0.7rem 0.9rem; border-radius: var(--r-sm); margin-bottom: 1rem;
  }
  .form-success {
    background: var(--success-bg); color: var(--success); font-size: 0.85rem;
    padding: 0.7rem 0.9rem; border-radius: var(--r-sm); margin-bottom: 1rem;
  }

  .auth-card .fine { text-align: center; font-size: 0.85rem; color: var(--ink-600); margin-top: 1.3rem; }
  .auth-card .fine a { color: var(--orange-600); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>

<nav class="public-nav">
  <a href="index.html" class="wordmark">FIND A <span>BUDDY</span></a>
  <a href="register.html">Need an account?</a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="kicker">Savannah State University</div>
    <h1 class="display">Log in</h1>
    <p class="sub">Enter your SSU email and password to continue.</p>

    <p id="form-success" class="form-success" hidden>Account created! Log in below.</p>
    <p id="form-error" class="form-error" hidden></p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">SSU Email</label>
        <input id="email" name="email" type="email" placeholder="you@savannahstate.edu" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required>
      </div>
      <button class="btn" type="submit" id="submit-btn">Log in</button>
    </form>

    <p class="fine">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script src="api.js"></script>
<script>
  const form = document.getElementById('login-form');
  const errorEl = document.getElementById('form-error');
  const successEl = document.getElementById('form-success');
  const submitBtn = document.getElementById('submit-btn');

  if (new URLSearchParams(window.location.search).get('registered') === '1') {
    successEl.hidden = false;
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    errorEl.hidden = true;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    const data = Object.fromEntries(new FormData(form).entries());
    try {
      const result = await api.login(data);
      document.body.innerHTML = `
        <div class="auth-wrap">
          <div class="auth-card" style="text-align:center;">
            <h1 class="display" id="welcome-heading"></h1>
            <p class="sub">You're logged in. The course/matching/mascot pages are next up.</p>
          </div>
        </div>
      `;
      document.getElementById('welcome-heading').textContent = `Welcome back, ${result.user.first_name}!`;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log in';
    }
  });
</script>
</body>
</html>
